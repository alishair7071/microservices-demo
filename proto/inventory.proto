syntax = "proto3";

package inventory;

service InventoryService {
  rpc ReduceStock (ReduceStockRequest) returns (ReduceStockResponse);
  rpc RestoreStock (RestoreStockRequest) returns (ReduceStockResponse);
}

message ReduceStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ReduceStockResponse {
  bool success = 1;
  int32 remaining_stock = 2;
}

message RestoreStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}
