services:
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "4001:4001"
    expose:
      - "50051"
    depends_on:
      mongo:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    ports:
      - "4002:4002"
    depends_on:
      mongo:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      email-service-a:
        condition: service_healthy
      email-service-b:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  email-service-a:
    image: microservices-demo-email-service:latest
    build:
      context: .
      dockerfile: email-service/Dockerfile
    ports:
      - "4003:4003"
    environment:
      EMAIL_SERVICE_NAME: email-service-A
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4003/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  email-service-b:
    image: microservices-demo-email-service:latest
    build:
      context: .
      dockerfile: email-service/Dockerfile
    ports:
      - "4005:4003"
    environment:
      EMAIL_SERVICE_NAME: email-service-B
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4003/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "4004:4004"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4004/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      order-service:
        condition: service_started

volumes:
  mongo-data:
